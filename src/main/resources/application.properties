# Spring AI Demo Application Configuration

# Application Configuration
spring.application.name=spring-ai-demo

# OpenAI Configuration
# Get your API key from: https://platform.openai.com/api-keys
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Chat model configuration - GPT-3.5-turbo for cost-effective chat completions
spring.ai.openai.chat.model=gpt-3.5-turbo
spring.ai.openai.chat.temperature=0.7

# Embedding model configuration - Ada 002 for text embeddings
spring.ai.openai.embedding.model=text-embedding-ada-002

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.org.springframework.ai=DEBUG
logging.level.com.mahesh.spring.ai.demo=DEBUG

